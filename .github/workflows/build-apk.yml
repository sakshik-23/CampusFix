name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'campusfix_admin/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd campusfix_admin
          flutter pub get

      - name: Build APK
        run: |
          cd campusfix_admin
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: campusfix-admin-apk
          path: campusfix_admin/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
